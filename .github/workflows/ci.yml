name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Test shard ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CONTAINER_ENGINE: docker
      MELOFON_TEST_IMAGE: localhost/melofon-dev:ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build the shared dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          tags: localhost/melofon-dev:ci
          load: true
          push: false
          cache-from: type=gha,scope=melofon-dev
          cache-to: type=gha,scope=melofon-dev,mode=max
      - name: Checks, native probes and test shard
        run: scripts/test --shard "${{ matrix.shard }}/4"
